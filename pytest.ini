# Chi thu test o tests/.
#
# `pytest -q` khong tham so se quet CA repo, ke ca scripts/. Mot file script
# ten test_*.py bi import luc collect -> code o cap module chay that. Truoc day
# scripts/test_tg.py lam dung the: no `raise SystemExit("Thieu TG_TOKEN")`,
# pytest bao INTERNALERROR va "no tests ran" - ca job CI do ma khong co mot
# dong test nao chay. Dong testpaths duoi day chan han loai loi do.
[pytest]
testpaths = tests
